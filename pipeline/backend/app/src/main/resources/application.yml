spring:
  application.name: scamshield-pipeline
  # 비밀값은 backend/app/.env (커밋 안 함). 없으면 무시
  config.import: optional:file:.env[.properties]
  threads.virtual.enabled: true
  datasource:
    # 시각은 전부 UTC 로 저장한다 (DATETIME 은 시간대를 안 들고 있다)
    url: jdbc:mysql://localhost:53306/scamshield?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: scamshield
    password: ${DB_PASSWORD:localdev}
    hikari:
      # MySQL 기본(REPEATABLE READ)은 트랜잭션 첫 읽기 시점에 고정돼 다른 트랜잭션이 막 넣은 READY 를 못 본다.
      # 실험 18개가 검증한 규칙은 READ COMMITTED 기준이다.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  kafka:
    bootstrap-servers: localhost:59092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: scamshield-intake
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      concurrency: ${scamshield.kafka.partitions}   # 소비 스레드 = 파티션 수 (1이면 모든 통화가 한 줄로 밀린다)

server:
  port: 8081

management:
  endpoints.web.exposure.include: health,prometheus,metrics

# 설정 손잡이 (명세 6절). 부하 실험 때 바꾸는 값은 전부 여기.
scamshield:
  dev:
    enabled: ${DEV_ENDPOINTS:false}  # true 면 토큰 없는 개발용 입구(/api/dev/**)를 연다. 배포에서는 끈다
  access:
    token-ttl-hours: 6           # 통화 토큰 유효 시간
    create-per-minute: 10        # IP 하나가 1분에 만들 수 있는 통화 수. 넘으면 429
  web:
    # 업로드 WS 허용 Origin (쉼표 구분). 배포 때 우리 도메인으로 바꾼다
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  roles: api,executor            # api = 업로드·SSE·입력 / executor = 작업 실행. 같은 jar, 프로필처럼 켠다
  kafka:
    topic: utterance
    partitions: 6                # 동시 통화 목표(ALL1) 나오면 정한다
  executor:
    workers: 4
    poll-interval-ms: 100
    lease-seconds: 30            # AI 타임아웃(AI7) + 여유
    max-attempts: 3
    recover-interval-ms: 2000
  agent:
    mode: fake                   # fake | http
    url: http://localhost:9000/analyze
    timeout-ms: 20000
    context-size: 6              # 문맥 N (AI4, 3/6/10 비교 예정)
    fake:
      delay-ms: 800
      jitter-ms: 400
      failure-rate: 0.0
  stt:
    mode: ${STT_MODE:fake}       # fake | rtzr
    max-sessions: ${STT_MAX_SESSIONS:5}  # 동시 STT 세션(= 화자) 상한. 리턴제로 무료 계정은 동시 5채널
    max-sessions-per-ip: ${STT_MAX_SESSIONS_PER_IP:4}  # IP 하나의 동시 STT 세션. 넘으면 1008
    max-tracks-per-call: 4       # 통화 하나(토큰 하나)가 열 수 있는 화자 수. 같은 trackId 재연결은 교체
    idle-seconds: 30             # 음성 프레임이 이만큼 안 오면 업로드 연결을 닫는다
    fake:
      bytes-per-utterance: 96000 # 16kHz·16bit·mono 3초 분량마다 대본 한 줄
    rtzr:
      base-url: openapi.vito.ai
      client-id: ${RTZR_CLIENT_ID:}
      client-secret: ${RTZR_CLIENT_SECRET:}
      # domain=CALL 은 통화 음성용 모델
      query: sample_rate=16000&encoding=LINEAR16&model_name=sommers_ko&domain=CALL&use_itn=true&use_disfluency_filter=false&use_profanity_filter=false
      # 키워드 부스팅 (한글·공백만, 20자·100개 이하, "단어:점수" 가능). 10-26 TTS 시험: 없으면 범죄→범주, 안전계좌→완전 계좌
      keywords: 범죄,안전계좌,검찰,수사관,이체,명의,연루,서울중앙지검
      eos-wait-ms: 3000
  sse:
    heartbeat-seconds: 15
    timeout-minutes: 30          # 이후 닫히고 EventSource 가 Last-Event-ID 로 다시 붙는다
    max-per-call: 3              # 통화당 SSE 연결. 넘으면 가장 오래된 연결을 닫는다
    max-total: 500               # 이 인스턴스 전체
    relay-interval-ms: 100
