# ScamShield 로컬 개발용 데이터 계층 (Kafka · MySQL)
# - 앱(Spring)은 호스트에서 ./gradlew bootRun 으로 띄운다.
# - 포트는 127.0.0.1 에만 묶는다. 0.0.0.0 금지 (Kafka 는 인증이 없고, DB 는 비밀번호 하나뿐이다).
# - 클라우드(데이터 인스턴스)에서는 ports: 를 지우고 앱 SG 에서만 접근한다 (명세 9.2).
name: scamshield

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scamshield
      MYSQL_USER: scamshield
      MYSQL_PASSWORD: ${DB_PASSWORD:-localdev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localroot}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--transaction-isolation=READ-COMMITTED"]
    ports:
      - "127.0.0.1:53306:3306"   # 3307 은 다른 프로젝트(buddyduck) MySQL 이 쓴다
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: 같은 compose 망 안의 컨테이너용 / HOST: 호스트의 앱용(127.0.0.1)
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 앱이 파티션 수를 정해 만든다
    ports:
      - "127.0.0.1:59092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  mysqldata:
  kafkadata:
