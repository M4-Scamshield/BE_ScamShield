# scamshield-kafka 서버용. 서버의 ~/deploy 에 두고 실행: docker compose up -d
# app·worker 가 사설 IP 로 접속한다(SG: 9092 ← app-sg·worker-sg 만). 공인 IP·EIP 불필요.
name: scamshield-kafka

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "9092:9092"          # 컨트롤러 9093 은 열지 않는다(컨테이너 안에서만)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      # 클라이언트가 이 주소로 다시 접속한다 → 이 서버의 사설 IP (인스턴스를 지우지 않는 한 고정)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_HOST:-172.31.0.192}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 앱 TopicConfig 가 만든다
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m         # t3.small 2GB. 나머지는 페이지 캐시
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  kafkadata:
